name: Contact Us
description: Share feedback, request assistance, or get in touch with the team.
title: "[Contact] "
labels: ["contact"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form to reach out to the Orbital Outfitters team. Fields marked **required** must be completed before submitting.

  # ── Topic ──────────────────────────────────────────────────
  - type: dropdown
    id: category
    attributes:
      label: Category
      description: Select the topic that best describes your enquiry.
      options:
        - Share feedback
        - Technical assistance
        - Learn more about a use case
        - Get in touch with Sales team
        - Request container customization
        - Other
    validations:
      required: true

  - type: textarea
    id: discussion
    attributes:
      label: What would you like to discuss?
      description: Provide as much detail as possible (max 500 characters).
      placeholder: ""
    validations:
      required: true

  # ── Contact Details ────────────────────────────────────────
  - type: input
    id: first_name
    attributes:
      label: First name
      placeholder: Jane

  - type: input
    id: last_name
    attributes:
      label: Last name
      placeholder: Smith

  - type: input
    id: email
    attributes:
      label: Email address
      placeholder: jane.smith@example.com
    validations:
      required: true

  - type: input
    id: phone
    attributes:
      label: Phone number
      placeholder: "+1 555 000 0000"

  - type: input
    id: company
    attributes:
      label: Company
      placeholder: Acme Corp

  # ── Privacy ────────────────────────────────────────────────
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy Policy
      options:
        - label: >
            I understand my personal data will be processed in accordance with
            [IBM's Privacy Policy](https://www.ibm.com/privacy).
    validations:
      required: true
