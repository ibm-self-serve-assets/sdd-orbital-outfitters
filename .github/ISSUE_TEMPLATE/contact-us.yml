name: Contact Us
description: Share feedback, request assistance or get in touch with the team.
title: "[Contact Us] "
labels: ["contact Us"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form to reach out to the DSCE team. Fields marked **required** must be completed before submitting.

  # ── Topic ──────────────────────────────────────────────────
  - type: dropdown
    id: category
    attributes:
      label: Category
      description: Select the topic that best describes your inquiry.
      options:
        - Share feedback
        - Technical assistance
        - Learn more about a use case
        - Get in touch with Sales team
        - Other
    validations:
      required: true

  - type: textarea
    id: discussion
    attributes:
      label: What would you like to discuss?
      description: Provide as much detail as possible (max 500 characters).
      placeholder: ""
    validations:
      required: true

  # ── Contact Details ────────────────────────────────────────
  - type: input
    id: name
    attributes:
      label: Name
      placeholder: Jane Smith

  - type: input
    id: email
    attributes:
      label: Email address
      placeholder: jane.smith@example.com
    validations:
      required: true

  - type: input
    id: company
    attributes:
      label: Company
      placeholder: Acme Corp

  # ── Privacy ────────────────────────────────────────────────
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy Policy
      options:
        - label: >
            I understand my personal data will be processed in accordance with
            [IBM's Privacy Policy](https://www.ibm.com/privacy).
    validations:
      required: true
